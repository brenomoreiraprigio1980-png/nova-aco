name: apply-uploaded-site
on:
  push:
    branches: [staging-upload-claude-2026-09-29]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==12.3.0 brotli
      - name: Rebuild uploaded package exactly
        shell: python
        run: |
          from PIL import Image,ImageOps
          from pathlib import Path
          import base64,brotli,json,io,hashlib

          # Restore the exact UTF-8 text files from the uploaded ZIP payload.
          payload=''.join(p.read_text() for p in sorted(Path('.upload').glob('payload-*')))
          text_files=json.loads(brotli.decompress(base64.b64decode(payload)).decode('utf-8'))
          for path,text in text_files.items():
              p=Path(path); p.parent.mkdir(parents=True,exist_ok=True)
              p.write_bytes(text.encode('utf-8'))

          out=Path('assets/img'); out.mkdir(parents=True,exist_ok=True)

          pairs=[
            ('acompanhamento-nova-aco','assets/acompanhamento-nova-aco.jpeg',(900,1200),(480,640)),
            ('foto-ferragens-acompanhamento','assets/foto-ferragens-acompanhamento.jpg',(900,1200),(480,640)),
            ('obra-1','assets/obra-1.jpg',(900,1200),(480,640)),
            ('obra-2','assets/obra-2.jpg',(900,1200),(480,640)),
            ('produto-arame-12-nova-aco','assets/produto-arame-12-nova-aco.jpg',(900,1200),(480,640)),
            ('produto-arames-final','assets/produto-arames-final.jpg',(1200,900),(640,480)),
            ('produto-arames-real','assets/produto-arames-real.jpg',(900,1200),(480,640)),
            ('produto-colunas-catalogo','assets/produto-colunas-catalogo.png',(960,1200),(512,640)),
            ('produto-colunas-final','assets/produto-colunas-final.jpg',(900,1200),(480,640)),
            ('produto-colunas-real','assets/produto-colunas-real.jpg',(900,1200),(480,640)),
            ('produto-corte-dobra-final','assets/produto-corte-dobra-final.jpg',(900,1200),(480,640)),
            ('produto-corte-dobra-real','assets/produto-corte-dobra-real.jpg',(900,1200),(480,640)),
            ('produto-estacas-final','assets/produto-estacas-final.jpg',(1200,1064),(640,567)),
            ('produto-estacas-realista','assets/produto-estacas-realista.png',(900,1200),(480,640)),
            ('produto-malha-pop-real','assets/produto-malha-pop-real.jpg',(900,1200),(480,640)),
            ('produto-pregos-final','assets/produto-pregos-final.jpg',(1200,900),(640,480)),
            ('produto-pregos-real','assets/produto-pregos-real.jpg',(900,1200),(480,640)),
            ('produto-sapatas-final','assets/produto-sapatas-final.jpg',(900,1200),(480,640)),
            ('produto-sapatas-real','assets/produto-sapatas-real.jpg',(900,1200),(480,640)),
            ('produto-sapatas-sem-dedo','assets/produto-sapatas-sem-dedo.jpg',(986,1200),(526,640)),
            ('produto-vergalhoes-final','assets/produto-vergalhoes-final.jpg',(1200,900),(640,480)),
            ('produto-vergalhoes-realista','assets/produto-vergalhoes-realista.png',(900,1200),(480,640)),
            ('produto-vigas-real','assets/produto-vigas-real.jpg',(900,1200),(480,640)),
          ]

          def source_image(path):
              im=ImageOps.exif_transpose(Image.open(path))
              if 'A' not in im.mode:
                  im=im.convert('RGB')
              return im

          for name,src,full_size,small_size in pairs:
              full=source_image(src).resize(full_size,Image.Resampling.LANCZOS)
              b=io.BytesIO(); full.save(b,'WEBP',quality=78,method=6,exact=False)
              full_bytes=b.getvalue()
              (out/f'{name}.webp').write_bytes(full_bytes)

              decoded=Image.open(io.BytesIO(full_bytes))
              small=decoded.resize(small_size,Image.Resampling.LANCZOS)
              b=io.BytesIO(); small.save(b,'WEBP',quality=71,method=6,exact=False)
              (out/f'{name}-sm.webp').write_bytes(b.getvalue())

          # Special WebP outputs.
          im=ImageOps.exif_transpose(Image.open('assets/capa-logo-azul.png')).resize((900,1599),Image.Resampling.BICUBIC)
          b=io.BytesIO(); im.save(b,'WEBP',quality=80,method=4,exact=False)
          (out/'capa-logo-azul.webp').write_bytes(b.getvalue())

          logo=ImageOps.exif_transpose(Image.open('assets/logo-metalica-transparente.png')).resize((520,207),Image.Resampling.BICUBIC)
          b=io.BytesIO(); logo.save(b,'WEBP',quality=90,method=4,exact=False)
          (out/'logo-nova-aco.webp').write_bytes(b.getvalue())

          # PNG outputs.
          b=io.BytesIO(); logo.save(b,'PNG',optimize=True,compress_level=0)
          (out/'logo-nova-aco.png').write_bytes(b.getvalue())

          fav=ImageOps.exif_transpose(Image.open('assets/favicon-nova-aco.png')).resize((192,192),Image.Resampling.BICUBIC)
          b=io.BytesIO(); fav.save(b,'PNG',optimize=True,compress_level=0)
          (out/'favicon-192.png').write_bytes(b.getvalue())

          # JPEG cover.
          cover=ImageOps.exif_transpose(Image.open('assets/capa-nova-aco.png')).convert('RGB').resize((1672,941),Image.Resampling.LANCZOS)
          b=io.BytesIO(); cover.save(b,'JPEG',quality=82,progressive=True,optimize=False,subsampling=2)
          (out/'capa-nova-aco.jpg').write_bytes(b.getvalue())

