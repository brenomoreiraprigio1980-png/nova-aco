name: inspect-image-recipe
on:
  push:
    branches: [staging-upload-claude-2026-09-29]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==12.3.0
      - name: Find remaining exact recipes
        shell: python
        run: |
          from PIL import Image,ImageOps
          import io,hashlib
          def sha(b): return hashlib.sha256(b).hexdigest()

          # Find small-image recipe using vigas.
          src=ImageOps.exif_transpose(Image.open("assets/produto-vigas-real.jpg")).convert("RGB")
          full=src.resize((900,1200),Image.Resampling.LANCZOS)
          bb=io.BytesIO(); full.save(bb,"WEBP",quality=78,method=6,exact=False)
          full_dec=Image.open(io.BytesIO(bb.getvalue())).convert("RGB")
          expected="949d68e6231114ba872c84de83f69dc32dd919192f287e65a46820a4e219d64b"
          found=False
          for input_name,base in [("original",src),("full_decoded",full_dec)]:
            for res_name,res in [("LANCZOS",Image.Resampling.LANCZOS),("BICUBIC",Image.Resampling.BICUBIC),("BILINEAR",Image.Resampling.BILINEAR)]:
              im=base.resize((480,640),res)
              for q in range(45,91):
                for method in range(0,7):
                  for exact in (False,True):
                    b=io.BytesIO(); im.save(b,"WEBP",quality=q,method=method,exact=exact)
                    if sha(b.getvalue())==expected:
                      print("SM_EXACT",input_name,res_name,q,method,exact,len(b.getvalue())); found=True; raise SystemExit(0)
          print("SM_NO_MATCH")
