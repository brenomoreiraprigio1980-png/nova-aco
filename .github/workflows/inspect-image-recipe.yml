          }

          ok=0; bad=[]
          for name,(srcpath,size,expected) in specs.items():
            im=ImageOps.exif_transpose(Image.open(srcpath))
            if "A" not in im.mode: im=im.convert("RGB")
            im=im.resize(size,Image.Resampling.LANCZOS)
            b=io.BytesIO(); im.save(b,"WEBP",quality=78,method=6,exact=False)
            h=hashlib.sha256(b.getvalue()).hexdigest()
            if h==expected:
              ok+=1
            else:
              bad.append((name,len(b.getvalue()),h,expected))
          print("WEBP_MATCHES",ok,"OF",len(specs))
          for x in bad: print("WEBP_MISMATCH",x)

          def find_png(label,sources,size,expected):
            for srcpath in sources:
              src=ImageOps.exif_transpose(Image.open(srcpath))
              for res_name,res in [("LANCZOS",Image.Resampling.LANCZOS),("BICUBIC",Image.Resampling.BICUBIC)]:
                im=src.resize(size,res)
                for optimize in (False,True):
                  for level in range(0,10):
                    b=io.BytesIO(); im.save(b,"PNG",optimize=optimize,compress_level=level)
                    if hashlib.sha256(b.getvalue()).hexdigest()==expected:
                      print("PNG_EXACT",label,srcpath,res_name,optimize,level,len(b.getvalue()))
                      return
            print("PNG_NO_MATCH",label)

