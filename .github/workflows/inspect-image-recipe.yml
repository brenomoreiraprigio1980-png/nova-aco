name: inspect-image-recipe
on:
  push:
    branches: [staging-upload-claude-2026-09-29]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==12.3.0
      - name: Find special WebP recipes
        shell: python
        run: |
          from PIL import Image,ImageOps
          import io,hashlib
          def sha(b): return hashlib.sha256(b).hexdigest()
          def search(label,sources,size,expected):
            qorder=[80,82,85,78,75,90,88,84,83,81,79,77,76,74,72,71,70,86,87,89,91,92,93,94,95,96,97,98,99,100,69,68,67,66,65]
            for srcpath in sources:
              src=ImageOps.exif_transpose(Image.open(srcpath))
              for res_name,res in [("LANCZOS",Image.Resampling.LANCZOS),("BICUBIC",Image.Resampling.BICUBIC)]:
                im=src.resize(size,res)
                for q in qorder:
                  for method in (6,4,5,3,2,1,0):
                    for exact in (False,True):
                      b=io.BytesIO(); im.save(b,"WEBP",quality=q,method=method,exact=exact)
                      if sha(b.getvalue())==expected:
                        print("SPECIAL_EXACT",label,srcpath,res_name,q,method,exact,len(b.getvalue()))
                        return
            print("SPECIAL_NO_MATCH",label)
          search("capa-logo",["assets/capa-logo-azul.png"],(900,1599),"e1e479b2da9016604e4d23e0612da02022b06297f2c43e4a23393b3bfb9fbb48")
          search("logo",["assets/logo-metalica-transparente.png","assets/logo-transparent.png"],(520,207),"ea9e7d76b298446fe307c1128ab80c847016db7e35e924a7f6199a6a49367ef3")
